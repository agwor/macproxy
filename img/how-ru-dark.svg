<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 313" width="800" height="313" role="img" aria-labelledby="t d">
<title id="t">Как работает MacProxy</title><desc id="d">Выбранные программы идут через MacProxy и туннель на ваш VPN/прокси, остальные — напрямую.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#F2F2F2}
.b{font-size:16px;font-weight:600} .t{font-size:14px} .s{font-size:13px;fill:#A6A6A6}
.box{fill:#232323;stroke:#3D3D3D;stroke-width:1}
</style>
<defs>
<marker id="ha" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E6E6E6"/></marker>
<marker id="hn" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6B6B6B"/></marker>
<clipPath id="lt"><path d="M64 32L64 41.99C64 48.33 64 51.49 62.92 54.91C61.57 58.63 58.63 61.57 54.91 62.92C51.49 64 48.33 64 41.99 64L22.01 64C15.67 64 12.51 64 9.09 62.92C5.37 61.57 2.43 58.63 1.08 54.91C0 51.49 0 48.33 0 41.99L0 22.01C0 15.67 0 12.51 1.08 9.09C2.43 5.37 5.37 2.43 9.09 1.08C12.51 0 15.67 0 22.01 0L41.99 0C48.33 0 51.49 0 54.91 1.08C58.63 2.43 61.57 5.37 62.92 9.09C64 12.51 64 15.67 64 22.01Z"/></clipPath>
<filter id="ls" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="1.7" stdDeviation="2" flood-color="#000" flood-opacity="0.6"/></filter>
</defs>
<!-- выбранные программы -->
<rect class="box" x="0.5" y="8.5" width="230" height="176" rx="14"/>
<text class="b" x="20" y="40.5">Выбранные программы</text>
<g fill="#E6E6E6"><circle cx="25" cy="70.5" r="3.5"/><circle cx="25" cy="98.5" r="3.5"/><circle cx="25" cy="126.5" r="3.5"/><circle cx="25" cy="154.5" r="3.5"/></g>
<text class="t" x="38" y="75.5">Claude, ChatGPT, Cursor</text><text class="t" x="38" y="103.5">Терминал: claude, codex</text>
<text class="t" x="38" y="131.5">Telegram</text><text class="t" x="38" y="159.5">Браузеры, свой профиль</text>
<path d="M233.5 96.5H247.5" stroke="#E6E6E6" stroke-width="2" fill="none" marker-end="url(#ha)"/>
<!-- MacProxy -->
<rect class="box" x="250.5" y="52.5" width="186" height="88" rx="16"/>
<g transform="translate(266.5 78.5) scale(0.5625)"><path d="M64 32L64 41.99C64 48.33 64 51.49 62.92 54.91C61.57 58.63 58.63 61.57 54.91 62.92C51.49 64 48.33 64 41.99 64L22.01 64C15.67 64 12.51 64 9.09 62.92C5.37 61.57 2.43 58.63 1.08 54.91C0 51.49 0 48.33 0 41.99L0 22.01C0 15.67 0 12.51 1.08 9.09C2.43 5.37 5.37 2.43 9.09 1.08C12.51 0 15.67 0 22.01 0L41.99 0C48.33 0 51.49 0 54.91 1.08C58.63 2.43 61.57 5.37 62.92 9.09C64 12.51 64 15.67 64 22.01Z" fill="#292A2A"/><path d="M64 32L64 41.99C64 48.33 64 51.49 62.92 54.91C61.57 58.63 58.63 61.57 54.91 62.92C51.49 64 48.33 64 41.99 64L22.01 64C15.67 64 12.51 64 9.09 62.92C5.37 61.57 2.43 58.63 1.08 54.91C0 51.49 0 48.33 0 41.99L0 22.01C0 15.67 0 12.51 1.08 9.09C2.43 5.37 5.37 2.43 9.09 1.08C12.51 0 15.67 0 22.01 0L41.99 0C48.33 0 51.49 0 54.91 1.08C58.63 2.43 61.57 5.37 62.92 9.09C64 12.51 64 15.67 64 22.01Z" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="2" clip-path="url(#lt)"/><g filter="url(#ls)"><path d="M37.21 12.57A20.12 20.12 0 1 0 51.43 26.79" fill="none" stroke="#E5E6E8" stroke-width="6.37" stroke-linecap="round"/><circle cx="32" cy="32" r="7.84" fill="#E5E6E8"/></g></g>
<text class="b" x="314.5" y="88.5">MacProxy</text><text class="s" x="314.5" y="107.5">ядро Xray</text><text class="s" x="314.5" y="125.5">127.0.0.1</text>
<!-- туннель: подпись над линией, ни она, ни линия не касаются рамок -->
<path d="M444.5 96.5H500.5" stroke="#E6E6E6" stroke-width="4" stroke-linecap="round" fill="none"/>
<text class="s" x="472.5" y="82.5" text-anchor="middle">туннель</text>
<!-- ваш VPN/прокси -->
<rect class="box" x="508.5" y="52.5" width="170" height="88" rx="16"/>
<text class="b" x="524.5" y="92.5">Ваш VPN/прокси</text><text class="s" x="524.5" y="114.5">сервер или подписка</text>
<path d="M681.5 96.5H700.5" stroke="#E6E6E6" stroke-width="2" fill="none" marker-end="url(#ha)"/>
<!-- интернет: той же высоты, что соседние блоки -->
<rect class="box" x="703.5" y="52.5" width="96" height="88" rx="16"/>
<g transform="translate(751.5 86.5)" fill="none" stroke="#F2F2F2" stroke-width="1.6"><circle r="16"/><path d="M0 -16C-8 -9 -8 9 0 16M0 -16C8 -9 8 9 0 16M-15 -5H15M-15 5H15"/></g>
<text class="b" x="751.5" y="130.5" text-anchor="middle">Интернет</text>
<!-- всё остальное: напрямую, в Интернет снизу -->
<rect class="box" x="0.5" y="208.5" width="230" height="104" rx="14"/>
<text class="b" x="20" y="240.5">Всё остальное</text>
<g fill="#6B6B6B"><circle cx="25" cy="266.5" r="3.5"/><circle cx="25" cy="292.5" r="3.5"/></g>
<text class="t" x="38" y="271.5">остальные программы</text><text class="t" x="38" y="297.5">Safari и программы Apple</text>
<path d="M233.5 260.5H751.5V143.5" stroke="#6B6B6B" stroke-width="2" stroke-dasharray="6 6" fill="none" marker-end="url(#hn)"/>
<rect x="383.0" y="248.5" width="216" height="24" rx="12" fill="#161616" stroke="#3D3D3D"/>
<text class="s" x="491.0" y="265.0" text-anchor="middle">напрямую, как без MacProxy</text>
</svg>
